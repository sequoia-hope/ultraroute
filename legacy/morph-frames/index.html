<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morph Playback</title>
<style>
:root { --bg: #0d1820; --panel: #15232d; --text: #dce6ec; --muted: #8aa0ad; --accent: #edcf86; --error: #ff3b5c; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif;
       display: flex; flex-direction: column; height: 100vh; }
header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 16px; background: var(--panel); }
select, button { background: var(--bg); color: var(--text); border: 1px solid #2c3f4c; border-radius: 6px;
                 padding: 6px 10px; font: inherit; cursor: pointer; }
button#play { min-width: 76px; color: var(--accent); }
input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
#count { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 90px; text-align: right; }
#about { padding: 6px 16px; color: var(--muted); background: var(--panel); border-top: 1px solid #22323d; }
#label { color: var(--accent); }
#errors { padding: 4px 16px 6px; background: var(--panel); display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
          max-height: 72px; overflow-y: auto; font-size: 12px; }
#errors:empty { display: none; }
#errors b { color: var(--error); font-weight: 600; }
#errors button { padding: 1px 6px; font-size: 12px; border-color: #5a2a35; }
#hint { color: var(--muted); font-size: 12px; }
main { flex: 1; min-height: 0; overflow: hidden; position: relative; cursor: grab; touch-action: none; }
main.dragging { cursor: grabbing; }
#board { position: absolute; inset: 8px; transform-origin: 0 0; user-select: none; }
#board svg { width: 100%; height: 100%; display: block; }
#board .mark { fill: none; stroke: var(--error); vector-effect: non-scaling-stroke; stroke-width: 2.5; }
#board .mark.focus { stroke: #fff; stroke-width: 4; }
main.noerrors #board .mark { display: none; }
</style>
<style id="layerstyle"></style>
</head>
<body>
<header>
  <select id="run" aria-label="Run"></select>
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Frame">
  <span id="count"></span>
  <select id="speed" aria-label="Speed">
    <option value="2">2 fps</option>
    <option value="5">5 fps</option>
    <option value="10" selected>10 fps</option>
    <option value="20">20 fps</option>
  </select>
  <select id="layer" aria-label="Copper layers"><option value="">All copper</option></select>
  <label><input id="showerrors" type="checkbox" checked> Errors</label>
  <button id="fit">Fit</button>
  <span id="hint">wheel or pinch to zoom, drag to pan</span>
</header>
<div id="about"><span id="label"></span> <span id="desc"></span></div>
<div id="errors"></div>
<main><div id="board"></div></main>
<script>
const $ = id => document.getElementById(id);
let runs = {}, frames = [], svgs = new Map(), run = "", at = 0, timer = null, shown = -1, focus = -1, bounds = null;

function fetchSvg(i) {
  const key = `${run}/${frames[i].file}`;
  if (!svgs.has(key)) svgs.set(key, fetch(key).then(r => r.text()));
  return svgs.get(key);
}

async function load(name) {
  stop();
  run = name;
  const text = await (await fetch(`${name}/frames.jsonl`, { cache: "no-store" })).text();
  frames = text.split("\n").filter(Boolean).map(l => JSON.parse(l));
  svgs = new Map();
  shown = -1;
  bounds = null;
  $("desc").textContent = runs[name]?.args || "";
  $("scrub").max = frames.length - 1;
  history.replaceState(null, "", `?run=${encodeURIComponent(name)}`);
  await show(0);
  layers();
}

function errorsOf(i) { return frames[i]?.stats?.errors || []; }

async function show(i, keepFocus) {
  at = Math.max(0, Math.min(frames.length - 1, i));
  const wanted = at, f = frames[at];
  $("scrub").value = at;
  $("count").textContent = `${at + 1} / ${frames.length}`;
  $("label").textContent = f.stats?.shape || f.operators?.filter(o => o !== "reshape" && o !== "outline").join(" ") || "";
  if (!keepFocus) focus = -1;
  for (let k = 1; k <= 4 && at + k < frames.length; k++) fetchSvg(at + k);
  const svg = await fetchSvg(at);
  if (wanted !== at) return;
  if (shown !== at) {
    $("board").innerHTML = svg;
    shown = at;
    fitOutline();
    drawMarks();
  }
  listErrors();
}

function viewBox() {
  const vb = $("board").querySelector("svg")?.viewBox.baseVal;
  return vb ? [vb.x, vb.y, vb.width, vb.height] : [0, 0, 1, 1];
}

function fitOutline() {
  const svg = $("board").querySelector("svg");
  if (!svg) return;
  for (const p of svg.querySelectorAll('polygon[fill="none"][stroke="#83c5af"]')) {
    for (const pt of p.points) {
      bounds = bounds ? [Math.min(bounds[0], pt.x), Math.min(bounds[1], pt.y), Math.max(bounds[2], pt.x), Math.max(bounds[3], pt.y)]
                      : [pt.x, pt.y, pt.x, pt.y];
    }
  }
  if (!bounds) return;
  const pad = 0.03 * Math.max(bounds[2] - bounds[0], bounds[3] - bounds[1]);
  svg.setAttribute("viewBox", `${bounds[0] - pad} ${bounds[1] - pad} ${bounds[2] - bounds[0] + 2 * pad} ${bounds[3] - bounds[1] + 2 * pad}`);
}

function drawMarks() {
  const svg = $("board").querySelector("svg");
  if (!svg) return;
  const [, , w, h] = viewBox();
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  errorsOf(at).forEach((e, k) => {
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", e.at[0]);
    c.setAttribute("cy", e.at[1]);
    c.setAttribute("r", Math.max(w, h) * 0.008);
    c.setAttribute("class", `mark${e.layer == null ? "" : ` l${e.layer}`}${k === focus ? " focus" : ""}`);
    const t = document.createElementNS("http://www.w3.org/2000/svg", "title");
    t.textContent = `${e.kind}: ${e.nets.filter(Boolean).join(" / ")}`;
    c.appendChild(t);
    g.appendChild(c);
  });
  svg.appendChild(g);
}

function listErrors() {
  const list = errorsOf(at);
  const box = $("errors");
  if (!list.length) { box.innerHTML = frames[at]?.stats?.errors ? "<span>no new errors</span>" : ""; return; }
  box.innerHTML = `<b>${list.length} new error${list.length === 1 ? "" : "s"}</b>` + list.map((e, k) =>
    `<button data-k="${k}" title="${e.nets.filter(Boolean).join(" / ")}">${e.kind}${e.layer == null ? "" : ` L${e.layer}`}</button>`).join("");
  box.querySelectorAll("button").forEach(b => b.onclick = () => goTo(Number(b.dataset.k)));
}

function goTo(k) {
  stop();
  const e = errorsOf(at)[k];
  const [x, y, w, h] = viewBox();
  const box = $("board").getBoundingClientRect(), W = box.width / zoom, H = box.height / zoom;
  const s = Math.min(W / w, H / h);
  const px = (W - w * s) / 2 + (e.at[0] - x) * s, py = (H - h * s) / 2 + (e.at[1] - y) * s;
  zoom = 12;
  panX = W / 2 - zoom * px;
  panY = H / 2 - zoom * py;
  place();
  focus = k;
  shown = -1;
  show(at, true);
}

function layers() {
  const svg = $("board").innerHTML;
  const found = [...new Set([...svg.matchAll(/class="l(\d+)"/g)].map(m => Number(m[1])))].sort((a, b) => a - b);
  const sel = $("layer"), keep = sel.value;
  sel.length = 1;
  found.forEach((l, k) => sel.add(new Option(k === 0 ? `Top only (L${l})` : k === found.length - 1 ? `Bottom only (L${l})` : `Inner L${l} only`, l)));
  sel.value = found.map(String).includes(keep) ? keep : "";
  applyLayer();
}

function applyLayer() {
  const l = $("layer").value;
  $("layerstyle").textContent = l === "" ? "" : `#board [class^="l"]:not(.l${l}), #board .mark[class*=" l"]:not(.l${l}) { display: none; }`;
}

function play() {
  if (at >= frames.length - 1) show(0);
  $("play").textContent = "Pause";
  timer = setInterval(() => {
    if (at >= frames.length - 1) return stop();
    show(at + 1);
  }, 1000 / Number($("speed").value));
}

function stop() {
  clearInterval(timer);
  timer = null;
  $("play").textContent = "Play";
}

let zoom = 1, panX = 0, panY = 0;
const view = document.querySelector("main"), board = $("board");
function place() { board.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`; }
function zoomAt(x, y, factor) {
  const next = Math.min(80, Math.max(1, zoom * factor));
  panX = x - (x - panX) * next / zoom;
  panY = y - (y - panY) * next / zoom;
  zoom = next;
  if (zoom === 1) panX = panY = 0;
  place();
}
function fit() { zoom = 1; panX = panY = 0; place(); }
view.addEventListener("wheel", e => {
  e.preventDefault();
  const r = board.getBoundingClientRect();
  zoomAt(e.clientX - r.left + panX, e.clientY - r.top + panY, Math.exp(-e.deltaY * 0.0015));
}, { passive: false });
const pointers = new Map();
let pinch = 0;
view.addEventListener("pointerdown", e => {
  view.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  view.classList.add("dragging");
});
view.addEventListener("pointermove", e => {
  const last = pointers.get(e.pointerId);
  if (!last) return;
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch) {
      const r = board.getBoundingClientRect();
      zoomAt((a[0] + b[0]) / 2 - r.left + panX, (a[1] + b[1]) / 2 - r.top + panY, d / pinch);
    }
    pinch = d;
  } else if (zoom > 1) {
    panX += e.clientX - last[0];
    panY += e.clientY - last[1];
    place();
  }
});
const release = e => {
  pointers.delete(e.pointerId);
  pinch = 0;
  if (!pointers.size) view.classList.remove("dragging");
};
view.addEventListener("pointerup", release);
view.addEventListener("pointercancel", release);
view.addEventListener("dblclick", fit);
$("fit").onclick = fit;

$("play").onclick = () => (timer ? stop() : play());
$("scrub").oninput = e => { stop(); show(Number(e.target.value)); };
$("speed").onchange = () => { if (timer) { stop(); play(); } };
$("run").onchange = e => load(e.target.value);
$("layer").onchange = applyLayer;
$("showerrors").onchange = e => view.classList.toggle("noerrors", !e.target.checked);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === " ") { e.preventDefault(); $("play").click(); }
  else if (e.key === "ArrowRight") { stop(); show(at + 1); }
  else if (e.key === "ArrowLeft") { stop(); show(at - 1); }
  else if (e.key === "0") fit();
});

(async () => {
  try { runs = await (await fetch("runs.json", { cache: "no-store" })).json(); } catch { runs = {}; }
  const names = Object.keys(runs).sort((a, b) => (runs[b].when || "").localeCompare(runs[a].when || "") || a.localeCompare(b));
  for (const n of names) $("run").add(new Option(runs[n].when ? `${n} (${runs[n].when.replace("T", " ")})` : n, n));
  const wanted = new URLSearchParams(location.search).get("run");
  if (wanted && !runs[wanted]) {
    runs[wanted] = { args: "(still running)" };
    names.unshift(wanted);
    $("run").add(new Option(`${wanted} (running)`, wanted), 0);
  }
  if (wanted) $("run").value = wanted;
  if (names.length) load($("run").value);
})();
</script>
</body>
</html>
