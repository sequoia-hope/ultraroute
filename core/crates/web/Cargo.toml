[package]
name = "web"
version = "0.1.0"
edition = "2021"
license = "MIT"

# The router in a browser tab: the whole ultraroute pipeline compiled to WebAssembly, run in a
# Web Worker, streaming the studio's live frames back to the page.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
board = { path = "../board" }
grid = { path = "../grid" }
kicad-pcb = { path = "../kicad-pcb" }
ultraroute = { path = "../ultraroute", default-features = false }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
