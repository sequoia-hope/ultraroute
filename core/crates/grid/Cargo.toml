[package]
name = "grid"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Grid routing on the core board model: a conservative obstacle map per net class, an integer
# cost field from the sources and a walk back down it, laid as tracks and vias.

[features]
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
board = { path = "../board" }
kicad-pcb = { path = "../kicad-pcb" }
morph = { path = "../morph" }
wgpu = { version = "=30.0.1", optional = true }
pollster = { version = "=0.4.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The process's CPU clock, for deadlines counted in CPU seconds (`clock::use_cpu_time`).
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
