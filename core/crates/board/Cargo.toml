[package]
name = "board"
version = "0.1.0"
edition = "2021"
license = "MIT"

# The routing board model in integer nanometres: copper shapes per layer, a spatial index,
# connectivity and a clearance check. Built from kicad-pcb's record.

[dependencies]
kicad-pcb = { path = "../kicad-pcb" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Thread and process CPU clocks for sub-stage timing (`work::enter`).
libc = "0.2"
