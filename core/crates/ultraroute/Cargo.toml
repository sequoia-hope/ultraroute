[package]
name = "ultraroute"
version = "0.1.0"
edition = "2021"
license = "MIT"

# The command-line router on the MIT core: routes a .kicad_pcb, writes the result, and can stream
# its progress live in the studio's frame format.

[features]
# The GPU field solver is experimental and slower than the CPU's search (REVIEW.md 3.4): built in
# only when asked for, with --features gpu.
default = []
gpu = ["grid/gpu"]
# A sampling profiler in the binary, needing no perf permissions: with ULTRAROUTE_PROFILE=FILE set,
# a run writes its stacks to FILE in the collapsed (flame graph) format.
profile = ["dep:pprof"]

[dependencies]
board = { path = "../board" }
morph = { path = "../morph" }
grid = { path = "../grid" }
kicad-pcb = { path = "../kicad-pcb" }
serde_json = "1"
pprof = { version = "0.15", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
