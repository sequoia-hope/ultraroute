<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fan-out Views</title>
<!-- The lab's views of the escape (fan-out) pass, drawn from fanout/<board>/trace.json, which
     core/crates/ultraroute/examples/fanout_trace.rs writes. Served only from the lab. -->
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1f21; --muted: #6b6f76; --line: #e2e2de;
  --accent: #2f6fdb; --good: #1f8a4c; --bad: #c43d3d; --warn: #b7791f; --code: #f0f0ec;
  --board: #0f1316; --board-line: #2a3138;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a; --panel: #1c1f24; --ink: #e6e6e3; --muted: #9298a2; --line: #2c3038;
    --accent: #6ea0ff; --good: #4cc27f; --bad: #ff6b6b; --warn: #e3a948; --code: #111316;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 3; }
header h1 { font-size: 17px; margin: 0; }
header a { color: var(--accent); text-decoration: none; font-size: 13px; }
.muted { color: var(--muted); }
select, button { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
button { cursor: pointer; }
button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
button.on .muted { color: #e6ecff; }
label.chk { font-size: 13px; display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px 0; }
main { padding: 12px 16px 40px; max-width: 1400px; }
.view { display: none; }
.view.on { display: block; }
.explain { max-width: 80ch; margin: 0 0 10px; }
.explain p { margin: 4px 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 12px; }
.canvas { background: var(--board); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; touch-action: none; }
.canvas svg { display: block; width: 100%; height: min(72vh, 760px); cursor: grab; }
.side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; }
.card .k { font-size: 11px; color: var(--muted); }
.card .v { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
.legend { font-size: 12px; display: flex; flex-direction: column; gap: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.legend span.l { display: inline-block; width: 22px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 6px; }
.hover { font-size: 12px; min-height: 2.6em; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 9px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
th:first-child, td:first-child { text-align: left; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--code); }
tbody tr.on td { background: color-mix(in srgb, var(--accent) 14%, transparent); }
td.worse { color: var(--bad); font-weight: 650; }
td.better { color: var(--good); font-weight: 650; }
.matrix { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.films { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.film { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.film svg { display: block; width: 100%; height: 280px; background: var(--board); cursor: grab; touch-action: none; }
.film .cap { padding: 6px 9px; font-size: 12px; }
.film .cap b { font-size: 13px; }
.kept { color: var(--good); font-weight: 650; }
.undone { color: var(--muted); }
@media (max-width: 860px) {
  .stage { grid-template-columns: 1fr; }
  .canvas svg { height: 60vh; }
}
</style>
</head>
<body>
<header>
  <h1>Fan-out views</h1>
  <label class="muted">Board <select id="boardSel"></select></label>
  <label class="muted">Part <select id="partSel"></select></label>
  <span id="layerBox" class="row" style="margin:0"></span>
  <label class="chk"><input type="checkbox" id="showPours" checked> pours</label>
  <a href="./">← Lab</a>
  <span class="muted" id="src" style="font-size:12px"></span>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"><p class="muted">Loading…</p></main>
<script>
const LAYER_COLORS = { 'F.Cu': '#e5534b', 'In1.Cu': '#d9a53a', 'In2.Cu': '#3fb37f', 'B.Cu': '#4f86e8' };
const FALLBACK = ['#c678dd', '#56b6c2', '#e5c07b', '#98c379'];
const NS = 'http://www.w3.org/2000/svg';
const qs = new URLSearchParams(location.search);
// Traces in fanout/<name>/: the earring with each plough (earring alone is the warp plough).
const BOARDS = ['earring', 'earring-rip', 'earring-gentle', 'earring-dipole', 'earring-linear'];
const state = { board: qs.get('board') || 'earring', part: qs.get('part') || null, view: location.hash.slice(1) || 'lanes', net: null, layers: null, pours: true, stage: 0, fieldNet: null };
let T = null;

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== undefined && v !== null) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function h(tag, attrs = {}, html = '') {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  e.innerHTML = html;
  return e;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const layerColor = (i) => LAYER_COLORS[T.layers[i]] ?? FALLBACK[i % FALLBACK.length];
const netName = (n) => T.nets[n] || '(no net)';
function netHue(n) { return `hsl(${(n * 137.508) % 360} 75% 62%)`; }
const part = () => T.parts.find((p) => p.ref === state.part) ?? T.parts[0];
// Bottom layer first, so the top copper lies over the rest.
const drawOrder = () => [...T.layers.keys()].reverse();
const visible = (layers) => layers.length === 0 || layers.some((l) => state.layers.has(l));

// Pan and zoom by viewBox: the wheel zooms about the pointer, a drag pans, a double click resets.
function panZoom(svg, box) {
  let vb = [...box];
  const set = () => svg.setAttribute('viewBox', vb.join(' '));
  set();
  const toWorld = (ev) => {
    const r = svg.getBoundingClientRect();
    const s = Math.max(vb[2] / r.width, vb[3] / r.height);
    const ox = vb[0] + (vb[2] - r.width * s) / 2, oy = vb[1] + (vb[3] - r.height * s) / 2;
    return [ox + (ev.clientX - r.left) * s, oy + (ev.clientY - r.top) * s, s];
  };
  svg.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const [x, y] = toWorld(ev);
    const k = Math.exp(ev.deltaY * 0.0015);
    vb = [x - (x - vb[0]) * k, y - (y - vb[1]) * k, vb[2] * k, vb[3] * k];
    set();
  }, { passive: false });
  let drag = null;
  svg.addEventListener('pointerdown', (ev) => { drag = [ev.clientX, ev.clientY, [...vb], toWorld(ev)[2]]; svg.setPointerCapture(ev.pointerId); });
  svg.addEventListener('pointermove', (ev) => {
    if (!drag) return;
    const [x0, y0, v0, s] = drag;
    vb = [v0[0] - (ev.clientX - x0) * s, v0[1] - (ev.clientY - y0) * s, v0[2], v0[3]];
    set();
  });
  svg.addEventListener('pointerup', () => (drag = null));
  svg.addEventListener('dblclick', () => { vb = [...box]; set(); });
}

// A pad's centre as escape.rs takes it: the middle of its bounding box.
function padCentre(q) {
  const pts = q.shape.poly ?? [q.shape.a, q.shape.b];
  const xs = pts.map((v) => v[0]), ys = pts.map((v) => v[1]);
  return [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2];
}

function windowBox(p, pad = 0) {
  const [[x0, y0], [x1, y1]] = p.window;
  return [x0 - pad, y0 - pad, x1 - x0 + 2 * pad, y1 - y0 + 2 * pad];
}

function drawShape(g, s, attrs) {
  if (s.poly) return el('polygon', { points: s.poly.map((q) => q.join(',')).join(' '), ...attrs }, g);
  if (s.a[0] === s.b[0] && s.a[1] === s.b[1]) return el('circle', { cx: s.a[0], cy: s.a[1], r: s.r, ...attrs }, g);
  return el('line', { x1: s.a[0], y1: s.a[1], x2: s.b[0], y2: s.b[1], 'stroke-width': 2 * s.r, 'stroke-linecap': 'round', ...attrs }, g);
}

function drawPours(g, scale = 1) {
  if (!state.pours) return;
  for (const l of drawOrder()) {
    if (!state.layers.has(l)) continue;
    for (const p of T.pours) {
      if (!p.layers.includes(l)) continue;
      const c = layerColor(l);
      const e = drawShape(g, p.shape, { fill: c, 'fill-opacity': (p.kept ? 0.3 : 0.06) * scale, stroke: p.kept ? '#fff' : c, 'stroke-opacity': (p.kept ? 0.7 : 0.2) * scale, 'stroke-width': p.kept ? 0.03 : 0.015, 'stroke-dasharray': p.kept ? '0.12 0.08' : null });
      e.dataset.tip = `${p.kept ? 'kept (block) ' : ''}pour of ${netName(p.net)} on ${T.layers[l]}`;
      e.dataset.net = p.net;
    }
  }
}

function drawPads(g, opts = {}) {
  for (const p of T.pads) {
    if (!visible(p.layers)) continue;
    const mine = p.ref === state.part;
    const sel = state.net !== null && p.net === state.net;
    const fill = opts.padFill?.(p) ?? (sel ? '#fff' : mine ? '#c9b37a' : '#8a7c58');
    const e = drawShape(g, p.shape, { fill, 'fill-opacity': opts.fade ? 0.22 : opts.dim && !mine ? 0.45 : 0.92, stroke: opts.padStroke?.(p) ?? null, 'stroke-width': opts.padStroke?.(p) ? 0.06 : null });
    e.dataset.tip = `${p.ref}-${p.number || '·'} ${netName(p.net)}`;
    e.dataset.net = p.net;
  }
}

function drawCopper(g, items, style = {}) {
  for (const l of drawOrder()) {
    for (const c of items) {
      if (c.via ? l !== drawOrder()[drawOrder().length - 1] : !c.layers.includes(l)) continue;
      if (!visible(c.layers)) continue;
      const dim = state.net !== null && c.net !== state.net;
      const color = style.color ?? (c.via ? '#d6d6d6' : layerColor(l));
      const attrs = c.via
        ? { fill: style.fill ?? color, 'fill-opacity': dim ? 0.2 : style.opacity ?? 0.9, stroke: style.stroke ?? null, 'stroke-width': style.stroke ? 0.03 : null, 'stroke-dasharray': style.dash ?? null }
        : { stroke: color, 'stroke-opacity': dim ? 0.15 : style.opacity ?? 0.85, fill: 'none', 'stroke-dasharray': style.dash ?? null };
      const e = drawShape(g, c.shape, attrs);
      if (style.thin && !c.via) e.setAttribute('stroke-width', style.thin);
      e.dataset.tip = `${c.via ? 'via' : 'track on ' + T.layers[l]} · ${netName(c.net)}${style.label ? ' · ' + style.label : ''}`;
      e.dataset.net = c.net;
    }
  }
}

function drawAirlines(g, lines, colorOf) {
  for (const a of lines) {
    const e = el('line', { x1: a.from[0], y1: a.from[1], x2: a.to[0], y2: a.to[1], stroke: colorOf(a), 'stroke-width': 0.035, 'stroke-dasharray': '0.15 0.08', 'vector-effect': null }, g);
    e.dataset.tip = `open: ${a.name}`;
    e.dataset.net = a.net;
    el('circle', { cx: a.from[0], cy: a.from[1], r: 0.05, fill: colorOf(a) }, g);
    el('circle', { cx: a.to[0], cy: a.to[1], r: 0.05, fill: colorOf(a) }, g);
  }
}

// Hover names what is under the pointer; a click picks its net to light up in every view.
function wire(svg, hover) {
  svg.addEventListener('pointermove', (ev) => {
    const t = ev.target.closest?.('[data-tip]');
    if (hover) hover.innerHTML = t ? esc(t.dataset.tip) : '<span class="muted">Hover copper, pads or lanes; click to pick a net.</span>';
  });
  let down = null;
  svg.addEventListener('pointerdown', (ev) => (down = [ev.clientX, ev.clientY]));
  svg.addEventListener('click', (ev) => {
    if (down && Math.hypot(ev.clientX - down[0], ev.clientY - down[1]) > 4) return;
    const t = ev.target.closest?.('[data-net]');
    const n = t ? +t.dataset.net : null;
    state.net = n === state.net || n === 0 ? null : n;
    render();
  });
}

// The pull of escape.rs's comb on one point of a net's copper: onto its nearest lane on the edge
// whose zone holds the point (the shallowest), or out past the zone where the net has no lane.
function pull(p, x, y, net) {
  const zone = T.options.zone, full = zone * T.options.full;
  let best = null;
  for (const e of p.edges) {
    const d = x * e.out[0] + y * e.out[1] - e.row, t = x * e.along[0] + y * e.along[1];
    if (d >= 0 && d <= zone && t >= e.from - zone && t <= e.to + zone && (!best || d < best.d)) best = { e, d, t };
  }
  if (!best) return null;
  const { e, d, t } = best;
  const lanes = e.lanes.filter((l) => l.net === net).map((l) => l.t);
  if (lanes.length) {
    const lane = lanes.reduce((a, b) => (Math.abs(b - t) < Math.abs(a - t) ? b : a));
    const w = d <= full ? 1 : Math.min(1, Math.max(0, (zone - d) / Math.max(zone - full, 1e-6)));
    const by = (lane - t) * w;
    return { dx: e.along[0] * by, dy: e.along[1] * by, own: true, w };
  }
  const by = zone + T.options.clear - d;
  return { dx: e.out[0] * by, dy: e.out[1] * by, own: false, w: 1 };
}

function edgeQuad(e, t0, t1, d0, d1) {
  const at = (t, d) => [e.along[0] * t + e.out[0] * (e.row + d), e.along[1] * t + e.out[1] * (e.row + d)];
  return [at(t0, d0), at(t1, d0), at(t1, d1), at(t0, d1)].map((q) => q.join(',')).join(' ');
}

function drawZones(g, p, opts = {}) {
  const zone = T.options.zone, full = zone * T.options.full;
  for (const e of p.edges) {
    const t0 = e.from - zone, t1 = e.to + zone;
    el('polygon', { points: edgeQuad(e, t0, t1, 0, full), fill: '#9ab6ff', 'fill-opacity': opts.strong ? 0.16 : 0.08 }, g);
    const steps = 6;
    for (let i = 0; i < steps; i++) {
      const a = full + ((zone - full) * i) / steps, b = full + ((zone - full) * (i + 1)) / steps;
      el('polygon', { points: edgeQuad(e, t0, t1, a, b), fill: '#9ab6ff', 'fill-opacity': (opts.strong ? 0.16 : 0.08) * (1 - (i + 0.5) / steps) }, g);
    }
    el('polygon', { points: edgeQuad(e, t0, t1, 0, zone), fill: 'none', stroke: '#9ab6ff', 'stroke-opacity': 0.5, 'stroke-width': 0.02 }, g);
    const c = zone + T.options.clear;
    el('polyline', { points: edgeQuad(e, t0, t1, c, c).split(' ').slice(0, 2).join(' '), stroke: '#ff9b6b', 'stroke-width': 0.025, 'stroke-dasharray': '0.1 0.07', fill: 'none' }, g);
  }
}

function base(container, p, pad = 0.2) {
  const svg = el('svg', {}, container);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  panZoom(svg, windowBox(p, pad));
  return svg;
}

function cards(items) {
  return `<div class="cards">${items.map(([k, v, cls]) => `<div class="card"><div class="k">${k}</div><div class="v ${cls ?? ''}">${v}</div></div>`).join('')}</div>`;
}

function legendLayers() {
  return T.layers.map((n, i) => `<div><span class="l" style="border-color:${layerColor(i)}"></span>${n}</div>`).join('');
}

// --- Views ---------------------------------------------------------------------------------

const VIEWS = [
  { key: 'lanes', label: 'Lanes and zones', draw: viewLanes },
  { key: 'field', label: 'Pull field', draw: viewField },
  { key: 'comb', label: 'Comb, step by step', draw: viewComb },
  { key: 'pads', label: 'Pads × steps', draw: viewPads },
  { key: 'clear', label: 'Lane clearing', draw: viewClear },
  { key: 'parts', label: 'Every part', draw: viewParts },
  { key: 'plough', label: 'Plough (--shove)', draw: viewPlough },
];

function viewLanes(root, p) {
  root.innerHTML = `<div class="explain">
    <p>Each signal pad on the package's outer rows owns a <b>lane</b>: the line straight out from its centre across a <b>fan-out zone</b> ${T.options.zone} mm deep.
    In the inner ${Math.round(T.options.full * 100)}% of the zone (solid band) a net's copper is pulled fully onto its nearest lane; the pull fades to nothing at the zone's outer edge.
    Copper of a net with no lane on that edge is pushed past the orange dashed line, ${T.options.clear} mm beyond the zone.</p>
    <p class="muted">Pads far from every side (the exposed pad) and pads with no net get no lane. Lanes are coloured by net.</p></div>`;
  const wrap = h('div', { class: 'stage' });
  const cv = h('div', { class: 'canvas' });
  const side = h('div', { class: 'side' });
  wrap.append(cv, side);
  root.append(wrap);
  const svg = base(cv, p);
  const g = el('g', {}, svg);
  drawPours(g);
  drawZones(g, p, { strong: true });
  drawPads(g);
  const showCopper = state.lanesCopper;
  if (showCopper) drawCopper(g, p.stages[0].copper, { opacity: 0.35 });
  for (const e of p.edges) {
    for (const l of e.lanes) {
      const sel = state.net === null || state.net === l.net;
      const ln = el('line', { x1: l.from[0], y1: l.from[1], x2: l.to[0], y2: l.to[1], stroke: netHue(l.net), 'stroke-width': sel ? 0.05 : 0.025, 'stroke-opacity': sel ? 0.95 : 0.25, 'stroke-linecap': 'round' }, g);
      ln.dataset.tip = `lane of ${l.name}`;
      ln.dataset.net = l.net;
    }
  }
  const nLanes = p.edges.reduce((a, e) => a + e.lanes.length, 0);
  const nets = new Set(p.edges.flatMap((e) => e.lanes.map((l) => l.net)));
  const shared = [...nets].filter((n) => p.edges.flatMap((e) => e.lanes).filter((l) => l.net === n).length > 1).length;
  const hover = h('div', { class: 'hover' });
  side.innerHTML = cards([['edges', p.edges.length], ['lanes', nLanes], ['nets with lanes', nets.size], ['nets with several', shared]]);
  const tog = h('label', { class: 'chk' }, `<input type="checkbox" ${showCopper ? 'checked' : ''}> routed copper underneath`);
  tog.querySelector('input').onchange = (ev) => { state.lanesCopper = ev.target.checked; render(); };
  side.append(tog, hover);
  side.append(h('div', { class: 'legend' }, `<div><span class="sw" style="background:#9ab6ff;opacity:.6"></span> full pull (inner ${Math.round(T.options.full * 100)}%)</div><div><span class="sw" style="background:#9ab6ff;opacity:.25"></span> fading pull</div><div><span class="l" style="border-color:#ff9b6b;border-top-style:dashed"></span>foreign copper pushed to here</div><div><span class="sw" style="border:1px dashed #fff"></span> kept (block) pour</div>${legendLayers()}`));
  wire(svg, hover);
}

function viewField(root, p) {
  const laneNets = [...new Set(p.edges.flatMap((e) => e.lanes.map((l) => l.net)))].sort((a, b) => netName(a).localeCompare(netName(b)));
  if (state.fieldNet === null || (state.fieldNet !== -1 && !laneNets.includes(state.fieldNet))) state.fieldNet = state.net !== null && laneNets.includes(state.net) ? state.net : laneNets[0] ?? -1;
  root.innerHTML = `<div class="explain">
    <p>Where the comb sends a point of copper, as a function of where it lies and whose it is. Pick a net: every arrow runs from a point to where that net's copper there would end up.
    Arrows run sideways onto the net's lanes; for a net with no lane on an edge they run straight out of the zone.
    Its routed copper is drawn bright, with the pull on each of its cut points.</p>
    <p class="muted">Points touching a pad, or locked copper of their net, stay put; the arrows here ignore that and show the rule alone.</p></div>`;
  const ctl = h('div', { class: 'row' });
  const sel = h('select');
  sel.innerHTML = laneNets.map((n) => `<option value="${n}" ${n === state.fieldNet ? 'selected' : ''}>${esc(netName(n))}</option>`).join('') + `<option value="-1" ${state.fieldNet === -1 ? 'selected' : ''}>a net with no lane here (pushed out)</option>`;
  sel.onchange = () => { state.fieldNet = +sel.value; state.net = state.fieldNet === -1 ? null : state.fieldNet; render(); };
  ctl.append(h('span', { class: 'muted' }, 'Net'), sel);
  root.append(ctl);
  const wrap = h('div', { class: 'stage' });
  const cv = h('div', { class: 'canvas' });
  const side = h('div', { class: 'side' });
  wrap.append(cv, side);
  root.append(wrap);
  const svg = base(cv, p);
  const defs = el('defs', {}, svg);
  const mk = el('marker', { id: 'ah', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 4, markerHeight: 4, orient: 'auto-start-reverse' }, defs);
  el('path', { d: 'M0,0 L10,5 L0,10 z', fill: 'context-stroke' }, mk);
  const g = el('g', {}, svg);
  drawPours(g);
  drawZones(g, p);
  drawPads(g, { dim: true });
  const net = state.fieldNet;
  for (const e of p.edges) for (const l of e.lanes) if (l.net === net) el('line', { x1: l.from[0], y1: l.from[1], x2: l.to[0], y2: l.to[1], stroke: netHue(l.net), 'stroke-width': 0.06, 'stroke-linecap': 'round' }, g);
  const [x0, y0, w, hh] = windowBox(p);
  const step = Math.max(w, hh) / 70;
  const fieldNet = net === -1 ? -999 : net;
  let moved = 0;
  for (let x = x0 + step / 2; x < x0 + w; x += step) {
    for (let y = y0 + step / 2; y < y0 + hh; y += step) {
      const m = pull(p, x, y, fieldNet);
      if (!m) continue;
      const len = Math.hypot(m.dx, m.dy);
      if (len < 1e-4) { el('circle', { cx: x, cy: y, r: step * 0.08, fill: '#5a6670' }, g); continue; }
      moved++;
      el('line', { x1: x, y1: y, x2: x + m.dx, y2: y + m.dy, stroke: m.own ? `hsl(200 80% ${45 + 30 * m.w}%)` : '#ff9b6b', 'stroke-width': step * 0.07, 'stroke-opacity': 0.75, 'marker-end': 'url(#ah)' }, g);
    }
  }
  if (net !== -1) {
    const mine = p.stages[0].copper.filter((c) => c.net === net);
    drawCopper(g, mine, { opacity: 0.95 });
    for (const c of mine) {
      const pts = c.shape.a[0] === c.shape.b[0] && c.shape.a[1] === c.shape.b[1] ? [c.shape.a] : (() => {
        const n = Math.max(1, Math.ceil(Math.hypot(c.shape.b[0] - c.shape.a[0], c.shape.b[1] - c.shape.a[1]) / 0.15));
        return Array.from({ length: n + 1 }, (_, i) => [c.shape.a[0] + ((c.shape.b[0] - c.shape.a[0]) * i) / n, c.shape.a[1] + ((c.shape.b[1] - c.shape.a[1]) * i) / n]);
      })();
      for (const [x, y] of pts) {
        const m = pull(p, x, y, net);
        if (m && Math.hypot(m.dx, m.dy) > 1e-3) el('line', { x1: x, y1: y, x2: x + m.dx, y2: y + m.dy, stroke: '#fff', 'stroke-width': 0.03, 'marker-end': 'url(#ah)' }, g);
      }
    }
  }
  const hover = h('div', { class: 'hover' });
  const nl = net === -1 ? 0 : p.edges.reduce((a, e) => a + e.lanes.filter((l) => l.net === net).length, 0);
  side.innerHTML = cards([['net', net === -1 ? 'foreign' : esc(netName(net))], ['its lanes', nl], ['grid points moved', moved], ['its routed pieces', net === -1 ? '–' : p.stages[0].copper.filter((c) => c.net === net).length]]);
  side.append(hover, h('div', { class: 'legend' }, `<div><span class="l" style="border-color:hsl(200 80% 75%)"></span>pulled fully onto a lane</div><div><span class="l" style="border-color:hsl(200 80% 50%)"></span>pull fading out</div><div><span class="l" style="border-color:#ff9b6b"></span>pushed out of the zone</div><div><span class="l" style="border-color:#fff"></span>the net's own routed copper, and its pull</div>`));
  wire(svg, hover);
}

const STAGE_TEXT = {
  routed: 'The board as the router left it, before the escape pass.',
  combed: 'After combing: copper of nets with a lane bent onto it, foreign copper pushed out. Pieces are cut 0.15 mm short so they can bend. Grey dashed: where the copper was.',
  ripped: 'After ripping every piece the comb left breaking a rule (red dashed). Their connections open again.',
  rerouted: 'After routing what is open again, through the cleared lanes. Bright outline: copper laid in this step.',
};

function viewComb(root, p) {
  const S = p.stages;
  state.stage = Math.min(state.stage, S.length - 1);
  const s = S[state.stage];
  root.innerHTML = `<div class="explain"><p>The escape pass on ${esc(p.ref)}, on its own copy of the board. In a real run the pass is undone when it leaves no fewer connections open.</p></div>`;
  const ctl = h('div', { class: 'row' });
  S.forEach((st, i) => {
    const b = h('button', { class: i === state.stage ? 'on' : '' }, `${i + 1}. ${st.name} <span class="muted">${st.open.length} open</span>`);
    b.onclick = () => { state.stage = i; render(); };
    ctl.append(b);
  });
  const play = h('button', {}, '▶ play');
  play.onclick = () => { let i = 0; const tick = () => { state.stage = i; render(); if (++i < S.length) setTimeout(tick, 1100); }; tick(); };
  ctl.append(play);
  root.append(ctl, h('p', { class: 'muted', style: 'margin:4px 0' }, STAGE_TEXT[s.name] ?? ''));
  const wrap = h('div', { class: 'stage' });
  const cv = h('div', { class: 'canvas' });
  const side = h('div', { class: 'side' });
  wrap.append(cv, side);
  root.append(wrap);
  const svg = base(cv, p);
  const g = el('g', {}, svg);
  drawPours(g);
  drawZones(g, p);
  const openPads = new Set(s.open.flatMap((a) => a.items));
  drawPads(g, { padStroke: (q) => (openPads.has(q.id) ? '#ff5d5d' : null) });
  drawCopper(g, s.copper);
  if (s.name === 'combed') drawCopper(g, s.gone, { color: '#9aa3ab', dash: '0.06 0.05', opacity: 0.7, thin: 0.03, label: 'before combing' });
  if (s.name === 'ripped') drawCopper(g, s.gone, { color: '#ff5d5d', dash: '0.08 0.05', opacity: 0.95, label: 'ripped' });
  if (s.name === 'rerouted') drawCopper(g, s.came, { color: '#ffffff', opacity: 0.55, thin: 0.03, label: 'laid now' });
  const first = new Set(S[0].open.map((a) => a.items.join(':')));
  drawAirlines(g, s.open, (a) => (first.has(a.items.join(':')) ? '#ffffff' : '#ff5d5d'));
  const hover = h('div', { class: 'hover' });
  const extra = s.name === 'combed' ? [['combed onto lanes', s.combed], ['pushed out', s.pushed_out]] : s.name === 'ripped' ? [['ripped', s.ripped], ['pieces gone here', s.gone.length]] : s.name === 'rerouted' ? [['rerouted', s.routed], ['failed', s.failed]] : [['pieces here', s.copper.length], ['vias here', s.copper.filter((c) => c.via).length]];
  const delta = s.open.length - S[0].open.length;
  side.innerHTML = cards([['open', s.open.length], ['vs routed', (delta > 0 ? '+' : '') + delta, delta > 0 ? 'worse' : ''], ...extra]);
  // Open count by step, as a small bar chart.
  const max = Math.max(...S.map((x) => x.open.length));
  const chart = h('div', { class: 'legend' }, '<div class="muted">open connections by step</div>' + S.map((x, i) => `<div style="display:grid;grid-template-columns:70px 1fr 28px;gap:6px;align-items:center"><span>${x.name}</span><span style="height:10px;border-radius:3px;background:${i === state.stage ? 'var(--accent)' : 'color-mix(in srgb, var(--accent) 40%, transparent)'};width:${(100 * x.open.length) / max}%"></span><span style="text-align:right">${x.open.length}</span></div>`).join(''));
  side.append(chart, hover, h('div', { class: 'legend' }, `<div><span class="l" style="border-color:#fff;border-top-style:dashed"></span>open, as routed</div><div><span class="l" style="border-color:#ff5d5d;border-top-style:dashed"></span>opened by this pass</div><div><span class="sw" style="border:2px solid #ff5d5d"></span> pad with an open connection</div>${legendLayers()}`));
  wire(svg, hover);
}

function viewPads(root, p) {
  root.innerHTML = `<div class="explain"><p>Every pad of ${esc(p.ref)} with a net, in order round the package, against each step of the pass: red where a connection to it is open.
  The trace on the right of each row counts that step's open pads. Click a column to light up its net.</p></div>`;
  // Order round the package: by angle about the pads' centre.
  const pads = p.pads.filter((q) => q.net !== 0);
  const centre = padCentre;
  const cs = pads.map(centre);
  const mx = cs.reduce((a, c) => a + c[0], 0) / cs.length, my = cs.reduce((a, c) => a + c[1], 0) / cs.length;
  const order = pads.map((q, i) => ({ q, ang: Math.atan2(cs[i][1] - my, cs[i][0] - mx) })).sort((a, b) => a.ang - b.ang).map((x) => x.q);
  // A pad has a lane when it sits on one of the package's edges; the exposed pad's pieces do not.
  const hasLane = (q) => {
    const [x, y] = centre(q);
    return p.edges.some((e) => e.lanes.some((l) => l.net === q.net && Math.abs(l.t - (x * e.along[0] + y * e.along[1])) < 1e-3 && Math.abs(x * e.out[0] + y * e.out[1] - e.row) < 1.5));
  };
  const cw = 15, rh = 22, lw = 78;
  const W = lw + order.length * cw + 60, H = 34 + p.stages.length * rh + 40;
  const box = h('div', { class: 'matrix' });
  root.append(box);
  const svg = el('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, style: 'font: 11px system-ui; fill: currentColor' }, box);
  order.forEach((q, i) => {
    const t = el('text', { x: lw + i * cw + cw / 2, y: 26, 'text-anchor': 'end', transform: `rotate(-60 ${lw + i * cw + cw / 2} 26)`, 'font-size': 9, fill: state.net === q.net ? 'var(--accent)' : 'var(--muted)' }, svg);
    t.textContent = q.number;
  });
  p.stages.forEach((s, r) => {
    const y = 34 + r * rh;
    const t = el('text', { x: 0, y: y + 14 }, svg);
    t.textContent = s.name;
    const open = new Set(s.open.flatMap((a) => a.items));
    let n = 0;
    order.forEach((q, i) => {
      const isOpen = open.has(q.id);
      n += isOpen;
      const c = el('rect', { x: lw + i * cw + 1, y: y + 2, width: cw - 2, height: rh - 4, rx: 2, fill: isOpen ? 'var(--bad)' : hasLane(q) ? 'color-mix(in srgb, var(--good) 45%, transparent)' : 'color-mix(in srgb, var(--muted) 25%, transparent)', stroke: state.net === q.net ? 'var(--accent)' : 'none', 'stroke-width': 2, style: 'cursor:pointer' }, svg);
      const tt = el('title', {}, c);
      tt.textContent = `${p.ref}-${q.number} ${netName(q.net)}: ${isOpen ? 'open' : 'connected'} after ${s.name}${hasLane(q) ? '' : ' (no lane)'}`;
      c.onclick = () => { state.net = state.net === q.net ? null : q.net; render(); };
    });
    const tn = el('text', { x: lw + order.length * cw + 8, y: y + 14 }, svg);
    tn.textContent = `${n} open`;
  });
  const ly = 34 + p.stages.length * rh + 14;
  [['var(--bad)', 'open'], ['color-mix(in srgb, var(--good) 45%, transparent)', 'connected, has a lane'], ['color-mix(in srgb, var(--muted) 25%, transparent)', 'connected, no lane (inner pad)']].forEach(([c, label], i) => {
    el('rect', { x: lw + i * 190, y: ly, width: 12, height: 12, rx: 2, fill: c }, svg);
    const t = el('text', { x: lw + i * 190 + 18, y: ly + 10 }, svg);
    t.textContent = label;
  });
  // Which nets the pass broke, and which it mended.
  const key = (a) => a.items.join(':');
  const first = new Map(p.stages[0].open.map((a) => [key(a), a]));
  const last = new Map(p.stages.at(-1).open.map((a) => [key(a), a]));
  const broke = [...last.values()].filter((a) => !first.has(key(a)));
  const mended = [...first.values()].filter((a) => !last.has(key(a)));
  root.append(h('h3', { style: 'font-size:15px;margin:16px 0 6px' }, `After rerouting: ${broke.length} connections newly open, ${mended.length} mended`));
  const tw = h('div', { class: 'tablewrap' });
  tw.innerHTML = `<table><thead><tr><th>net</th><th>change</th></tr></thead><tbody>${[...broke.map((a) => [a, 'newly open', 'worse']), ...mended.map((a) => [a, 'mended', 'better'])].map(([a, w, c]) => `<tr data-net="${a.net}"><td>${esc(a.name)}</td><td class="${c}">${w}</td></tr>`).join('') || '<tr><td colspan="2" class="muted">no change</td></tr>'}</tbody></table>`;
  tw.querySelectorAll('tr[data-net]').forEach((r) => (r.onclick = () => { state.net = +r.dataset.net; state.view = 'comb'; state.stage = p.stages.length - 1; location.hash = 'comb'; render(); }));
  root.append(tw);
}

function viewClear(root, p) {
  root.innerHTML = `<div class="explain"><p><b>Lane clearing</b> (<code>--clear-lanes</code>), pad by pad, on the board as routed: for a pad of ${esc(p.ref)} with an open connection,
  other nets' copper within half a pitch of its lane slides sideways out of the corridor, then whatever that breaks is ripped and everything open is routed again.
  A clearing is kept only when fewer connections are open after it; kept ones stay for the next pad.</p></div>`;
  if (!p.trials.length) { root.append(h('p', { class: 'muted' }, 'No pad of this part had an open connection, so nothing was tried.')); return; }
  const kept = p.trials.filter((t) => t.kept).length;
  root.append(h('div', { class: 'row' }, cards([['pads tried', p.trials.length], ['kept', kept]]).replace('class="cards"', 'class="cards" style="grid-template-columns:repeat(2,140px)"')));
  root.append(h('div', { class: 'legend', style: 'flex-direction:row;flex-wrap:wrap;gap:4px 14px;margin-bottom:8px' }, `<div><span class="sw" style="background:#9ab6ff;opacity:.5"></span> corridor</div><div><span class="l" style="border-color:#e3a948;border-top-style:dashed"></span>slid from</div><div><span class="l" style="border-color:#e3a948"></span>slid to</div><div><span class="l" style="border-color:#ff5d5d;border-top-style:dashed"></span>ripped</div><div><span class="l" style="border-color:#5ee08f"></span>laid by the reroute</div><div><span class="l" style="border-color:#ff5d5d;border-top-style:dotted"></span>newly open</div>`));
  const films = h('div', { class: 'films' });
  root.append(films);
  const zone = T.options.zone;
  for (const t of p.trials) {
    const card = h('div', { class: 'film' });
    films.append(card);
    const pad = p.pads.find((q) => q.id === t.pad);
    const c = padCentre(pad);
    const svg = el('svg', { preserveAspectRatio: 'xMidYMid meet' }, card);
    const R = zone + 0.9;
    panZoom(svg, [c[0] - R, c[1] - R, 2 * R, 2 * R]);
    const g = el('g', {}, svg);
    drawPours(g);
    // The corridor: the pad's lane, half a pitch either side, across the zone.
    for (const e of p.edges) {
      const lt = c[0] * e.along[0] + c[1] * e.along[1];
      if (!e.lanes.some((l) => l.net === t.net && Math.abs(l.t - lt) < 1e-3)) continue;
      const others = e.lanes.map((l) => Math.abs(l.t - lt)).filter((d) => d > 1e-3);
      const half = others.length ? Math.min(...others) / 2 : 0.2;
      el('polygon', { points: edgeQuad(e, lt - half, lt + half, 0, zone), fill: '#9ab6ff', 'fill-opacity': 0.22, stroke: '#9ab6ff', 'stroke-width': 0.015 }, g);
      break;
    }
    drawPads(g, { padStroke: (q) => (q.id === t.pad ? '#fff' : null) });
    drawCopper(g, t.base, { opacity: 0.3 });
    drawCopper(g, t.slid_from, { color: '#e3a948', dash: '0.06 0.04', opacity: 0.9, thin: 0.03, label: 'slid from' });
    drawCopper(g, t.slid_to, { color: '#e3a948', opacity: 0.95, label: 'slid to' });
    drawCopper(g, t.ripped_items, { color: '#ff5d5d', dash: '0.07 0.04', opacity: 0.95, label: 'ripped' });
    drawCopper(g, t.laid, { color: '#5ee08f', opacity: 0.9, label: 'laid by the reroute' });
    for (const a of t.newly_open) el('line', { x1: a.from[0], y1: a.from[1], x2: a.to[0], y2: a.to[1], stroke: '#ff5d5d', 'stroke-width': 0.03, 'stroke-dasharray': '0.03 0.04' }, g);
    const cap = h('div', { class: 'cap' }, `<b>${esc(p.ref)}-${esc(t.number)}</b> ${esc(t.name)} · <span class="${t.kept ? 'kept' : 'undone'}">${t.kept ? 'kept' : 'undone'}</span><br>
      ${t.moved} slid, ${t.ripped} ripped, ${t.routed} rerouted · open ${t.open_before} → ${t.open_after}${t.own_open ? ' · its own connection still open' : ''}${t.newly_open.length ? ` · newly open: ${t.newly_open.map((a) => esc(a.name)).join(', ')}` : ''}`);
    card.append(cap);
    const hv = h('div', { class: 'cap muted' }, '&nbsp;');
    card.append(hv);
    wire(svg, hv);
  }
}

function viewParts(root) {
  root.innerHTML = `<div class="explain"><p>The pass on every part with pads of different nets within 0.5 mm (what <code>--escape auto</code> picks), each on its own copy of the routed board.
  Open counts are for the whole board after each step. Click a row to look at that part.</p></div>`;
  const tw = h('div', { class: 'tablewrap' });
  const rows = T.parts.map((p) => {
    const [r, c, x, rr] = p.stages.map((s) => s.open.length);
    const cls = rr > r ? 'worse' : rr < r ? 'better' : '';
    const lanes = p.edges.reduce((a, e) => a + e.lanes.length, 0);
    const spark = (() => {
      const vs = [r, c, x, rr], m = Math.max(...vs, 1);
      return `<svg width="64" height="18" viewBox="0 0 64 18"><polyline fill="none" stroke="currentColor" stroke-width="1.5" points="${vs.map((v, i) => `${4 + i * 18},${16 - (14 * v) / m}`).join(' ')}"/></svg>`;
    })();
    const kept = p.trials.filter((t) => t.kept).length;
    return `<tr data-ref="${esc(p.ref)}" class="${p.ref === state.part ? 'on' : ''}"><td>${esc(p.ref)}</td><td>${lanes}</td><td>${p.stages[1].combed}</td><td>${p.stages[1].pushed_out}</td><td>${p.stages[2].ripped}</td><td>${p.stages[3].routed}</td><td>${r}</td><td>${c}</td><td>${x}</td><td class="${cls}">${rr}</td><td>${spark}</td><td>${p.trials.length ? `${kept} of ${p.trials.length}` : '–'}</td></tr>`;
  });
  tw.innerHTML = `<table><thead><tr><th>part</th><th>lanes</th><th>combed</th><th>pushed out</th><th>ripped</th><th>rerouted</th><th>open routed</th><th>combed</th><th>ripped</th><th>rerouted</th><th></th><th>lanes cleared (kept)</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
  tw.querySelectorAll('tr[data-ref]').forEach((r) => (r.onclick = () => { state.part = r.dataset.ref; state.view = 'comb'; state.stage = 3; location.hash = 'comb'; render(); }));
  root.append(tw);
}

function viewPlough(root) {
  const S = T.shove;
  if (!S) { root.append(h('p', { class: 'muted' }, 'This trace has no plough: run fanout_trace again.')); return; }
  root.innerHTML = `<div class="explain">
    <p><b>The plough</b> (<code>--shove</code>) takes each open connection trapped at a fine-pitch part's pads and looks for the cheapest path out to the rest of its net, treating other nets' routed copper as passable at a price.
    The copper on that path is then ploughed aside: on each layer the path runs on, a strip R wide either side of it moves R away, while pads, vias, locked copper and kept pours hold still. In between, the move falls off smoothly to nothing ${S.options.reach} mm out (a warp field).
    Copper crossing the path, and vias on it, are ripped. Whatever the plough leaves breaking a rule is ripped. The trapped connection is routed first, then everything opened on the way.
    If it still won't route, the next round rips whatever copper remains on the path. A try is kept only when the board ends with fewer connections open.</p>
    <p class="muted">Run on the routed board as a whole: open ${S.open_before} → ${S.open_after}. Plough: ${esc(S.options.plough)}, up to ${S.options.rounds} rounds.</p></div>`;
  const tw = h('div', { class: 'tablewrap' });
  if (state.tryIndex === undefined || state.tryIndex >= S.tries.length) state.tryIndex = 0;
  tw.innerHTML = `<table><thead><tr><th>trapped pad</th><th>net</th><th>rounds</th><th>routed out</th><th>open before → after</th><th>kept</th></tr></thead><tbody>${S.tries.map((t, i) => {
    const rounds = t.stages.filter((x) => x.name.startsWith('round')).length;
    return `<tr data-i="${i}" class="${i === state.tryIndex ? 'on' : ''}"><td>${esc(t.ref)}-${esc(t.number)}</td><td>${esc(t.name)}</td><td>${rounds}</td><td class="${t.routed ? 'better' : 'worse'}">${t.routed ? 'yes' : 'no'}</td><td class="${t.open_after < t.open_before ? 'better' : t.open_after > t.open_before ? 'worse' : ''}">${t.open_before} → ${t.open_after}</td><td class="${t.kept ? 'better' : ''}">${t.kept ? 'kept' : 'undone'}</td></tr>`;
  }).join('')}</tbody></table>`;
  tw.querySelectorAll('tr[data-i]').forEach((r) => (r.onclick = () => { state.tryIndex = +r.dataset.i; state.ploughStage = 0; render(); }));
  root.append(tw);
  const t = S.tries[state.tryIndex];
  const st = Math.min(state.ploughStage ?? 0, t.stages.length - 1);
  const s = t.stages[st];
  const ctl = h('div', { class: 'row', style: 'margin-top:12px' });
  t.stages.forEach((x, i) => {
    const b = h('button', { class: i === st ? 'on' : '' }, `${esc(x.name)} <span class="muted">${x.open.length} open</span>`);
    b.onclick = () => { state.ploughStage = i; render(); };
    ctl.append(b);
  });
  const play = h('button', {}, '▶ play');
  play.onclick = () => { let i = 0; const tick = () => { state.ploughStage = i; render(); if (++i < t.stages.length) setTimeout(tick, 1100); }; tick(); };
  ctl.append(play);
  root.append(ctl);
  const wrap = h('div', { class: 'stage' });
  const cv = h('div', { class: 'canvas' });
  const side = h('div', { class: 'side' });
  wrap.append(cv, side);
  root.append(wrap);
  const svg = el('svg', { preserveAspectRatio: 'xMidYMid meet' }, cv);
  const [[x0, y0], [x1, y1]] = t.window;
  panZoom(svg, [x0, y0, x1 - x0, y1 - y0]);
  const g = el('g', {}, svg);
  // Everything the step left alone fades back; what it moved, ripped and laid stands out.
  drawPours(g, 0.4);
  const openPads = new Set(s.open.flatMap((a) => a.items));
  drawPads(g, { fade: true, padStroke: (q) => (q.id === t.pad ? '#ffffff' : null) });
  const key = (c) => `${c.net}|${JSON.stringify(c.shape)}`;
  const cameIds = new Set((s.came ?? []).map((c) => c.id));
  drawCopper(g, s.copper.filter((c) => !cameIds.has(c.id)), { opacity: 0.13, label: 'left alone' });
  const rippedKeys = new Set((s.ripped_items ?? []).map(key));
  const isRepair = s.name === 'rerouted';
  // Before the reroute, what left the window was moved or ripped; in the reroute, only ripped.
  const ripped = isRepair ? s.gone ?? [] : (s.gone ?? []).filter((c) => rippedKeys.has(key(c)));
  const movedFrom = isRepair ? [] : (s.gone ?? []).filter((c) => !rippedKeys.has(key(c)));
  drawCopper(g, movedFrom, { color: '#e3a948', dash: '0.05 0.05', opacity: 0.7, thin: 0.03, label: 'moved from here' });
  drawCopper(g, ripped, { color: '#ff5d5d', dash: '0.1 0.06', opacity: 0.85, label: 'ripped' });
  if (s.came) {
    drawCopper(g, s.came.filter((c) => c.net !== t.net), { color: isRepair ? '#56c8f0' : '#e3a948', opacity: 0.95, label: isRepair ? 'rerouted' : 'moved to here' });
    drawCopper(g, s.came.filter((c) => c.net === t.net), { color: '#5ee08f', opacity: 1, label: 'the trapped connection, routed' });
  }
  if (s.path?.length) {
    // The path the round ploughed along, one polyline per run on a layer.
    let run = [];
    const flush = () => {
      if (run.length > 1) el('polyline', { points: run.map((q) => `${q[1]},${q[2]}`).join(' '), fill: 'none', stroke: '#ffffff', 'stroke-width': 0.04, 'stroke-opacity': 0.9, 'stroke-dasharray': '0.12 0.06', 'stroke-linejoin': 'round' }, g);
      run = [];
    };
    for (const q of s.path) {
      if (run.length && run[run.length - 1][0] !== q[0]) { el('circle', { cx: q[1], cy: q[2], r: 0.09, fill: 'none', stroke: '#fff', 'stroke-width': 0.03 }, g); flush(); }
      run.push(q);
    }
    flush();
  }
  const first = new Set(t.stages[0].open.map((a) => a.items.join(':')));
  drawAirlines(g, s.open.filter((a) => a.net === t.net || !first.has(a.items.join(':'))), (a) => (a.net === t.net ? '#5ee08f' : '#ff8bd1'));
  el('circle', { cx: t.to[0], cy: t.to[1], r: 0.12, fill: 'none', stroke: '#5ee08f', 'stroke-width': 0.04 }, g);
  const hover = h('div', { class: 'hover' });
  const extra = s.path
    ? [['path cells on copper', s.soft_cells], ['ripped on the path', s.crossed], ['ploughed aside', s.moved], ['ripped after', s.ripped]]
    : isRepair ? [['ripped by rip-up', ripped.length], ['rerouted pieces', (s.came ?? []).length]] : [['pieces here', s.copper.length]];
  side.innerHTML = cards([['open', s.open.length], ['trapped one', s.routed === undefined ? (st === 0 ? 'open' : t.routed ? 'out' : 'trapped') : s.routed ? 'out' : 'trapped'], ...extra]);
  side.append(hover, h('div', { class: 'legend' }, `<div><span class="sw" style="border:2px solid #fff"></span> the trapped pad · <span style="color:#5ee08f">○</span> where it is going</div>
    <div><span class="l" style="border-color:#fff;border-top-style:dashed"></span>the path it took (○ a via)</div>
    <div><span class="l" style="border-color:#5ee08f"></span>the trapped connection, routed</div>
    <div><span class="l" style="border-color:#e3a948"></span>copper moved to here <span class="muted">(dashed: from)</span></div>
    <div><span class="l" style="border-color:#ff5d5d;border-top-style:dashed"></span>copper ripped</div>
    <div><span class="l" style="border-color:#56c8f0"></span>rerouted afterwards</div>
    <div><span class="l" style="border-color:#ff8bd1;border-top-style:dashed"></span>connections this try knocked open</div>
    <div class="muted">Faint: copper, pads and pours this step left alone.</div>`));
  wire(svg, hover);
}

// --- Shell ---------------------------------------------------------------------------------

function render() {
  const p = part();
  state.part = p.ref;
  document.getElementById('partSel').value = p.ref;
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  for (const v of VIEWS) {
    const b = h('button', { class: v.key === state.view ? 'on' : '' }, v.label);
    b.onclick = () => { state.view = v.key; location.hash = v.key; render(); };
    tabs.append(b);
  }
  const main = document.getElementById('main');
  main.innerHTML = '';
  const root = h('div', { class: 'view on' });
  main.append(root);
  if (state.net !== null) {
    const bar = h('div', { class: 'row' }, `<span>Net <b>${esc(netName(state.net))}</b> lit up</span>`);
    const clr = h('button', {}, 'clear');
    clr.onclick = () => { state.net = null; render(); };
    bar.append(clr);
    root.append(bar);
  }
  (VIEWS.find((v) => v.key === state.view) ?? VIEWS[0]).draw(root, p);
  const u = new URL(location.href);
  u.searchParams.set('board', state.board);
  u.searchParams.set('part', p.ref);
  history.replaceState(null, '', u);
}

async function load() {
  const r = await fetch(`fanout/${encodeURIComponent(state.board)}/trace.json`, { cache: 'no-store' });
  if (!r.ok) { document.getElementById('main').innerHTML = `<p class="muted">No trace for ${esc(state.board)} yet: run fanout_trace into fanout/${esc(state.board)}/trace.json.</p>`; return; }
  T = await r.json();
  state.layers = new Set(T.layers.keys());
  const bs = document.getElementById('boardSel');
  bs.innerHTML = BOARDS.map((b) => `<option ${b === state.board ? 'selected' : ''}>${b}</option>`).join('');
  bs.onchange = () => { state.board = bs.value; state.part = null; load(); };
  const ps = document.getElementById('partSel');
  ps.innerHTML = T.parts.map((p) => `<option value="${esc(p.ref)}">${esc(p.ref)}${T.blocks.some((b) => b.parts.includes(p.ref)) ? ' (block)' : ''}</option>`).join('');
  ps.onchange = () => { state.part = ps.value; state.net = null; state.fieldNet = null; render(); };
  const lb = document.getElementById('layerBox');
  lb.innerHTML = '';
  T.layers.forEach((name, i) => {
    const l = h('label', { class: 'chk' }, `<input type="checkbox" checked><span class="sw" style="background:${layerColor(i)}"></span>${esc(name)}`);
    l.querySelector('input').onchange = (ev) => { ev.target.checked ? state.layers.add(i) : state.layers.delete(i); render(); };
    lb.append(l);
  });
  document.getElementById('showPours').onchange = (ev) => { state.pours = ev.target.checked; render(); };
  document.getElementById('src').textContent = `${T.board.split('/').pop()} · traced in ${T.seconds.toFixed(1)} s`;
  render();
}
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== state.view) { state.view = v; render(); } });
load();
</script>
