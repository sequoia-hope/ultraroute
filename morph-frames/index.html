<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morph Playback</title>
<style>
:root { --bg: #0d1820; --panel: #15232d; --text: #dce6ec; --muted: #8aa0ad; --accent: #edcf86; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif;
       display: flex; flex-direction: column; height: 100vh; }
header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 16px; background: var(--panel); }
select, button { background: var(--bg); color: var(--text); border: 1px solid #2c3f4c; border-radius: 6px;
                 padding: 6px 10px; font: inherit; cursor: pointer; }
button#play { min-width: 76px; color: var(--accent); }
input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
#count { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 90px; text-align: right; }
#about { padding: 6px 16px; color: var(--muted); background: var(--panel); border-top: 1px solid #22323d; }
#label { color: var(--accent); }
main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px; }
main img { max-width: 100%; max-height: 100%; object-fit: contain; }
</style>
</head>
<body>
<header>
  <select id="run" aria-label="Run"></select>
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Frame">
  <span id="count"></span>
  <select id="speed" aria-label="Speed">
    <option value="2">2 fps</option>
    <option value="5">5 fps</option>
    <option value="10" selected>10 fps</option>
    <option value="20">20 fps</option>
  </select>
</header>
<div id="about"><span id="label"></span> <span id="desc"></span></div>
<main><img id="frame" alt="Board frame"></main>
<script>
const $ = id => document.getElementById(id);
let runs = {}, frames = [], images = [], at = 0, timer = null;

async function load(name) {
  stop();
  const text = await (await fetch(`${name}/frames.jsonl`, { cache: "no-store" })).text();
  frames = text.split("\n").filter(Boolean).map(l => JSON.parse(l));
  images = frames.map(f => { const im = new Image(); im.src = `${name}/${f.file}`; return im; });
  $("desc").textContent = runs[name]?.args || "";
  $("scrub").max = frames.length - 1;
  history.replaceState(null, "", `?run=${encodeURIComponent(name)}`);
  show(0);
}

function show(i) {
  at = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[at];
  $("frame").src = images[at].src;
  $("scrub").value = at;
  $("count").textContent = `${at + 1} / ${frames.length}`;
  $("label").textContent = f.stats?.shape || f.operators?.filter(o => o !== "reshape" && o !== "outline").join(" ") || "";
}

function play() {
  if (at >= frames.length - 1) show(0);
  $("play").textContent = "Pause";
  timer = setInterval(() => {
    if (at >= frames.length - 1) return stop();
    show(at + 1);
  }, 1000 / Number($("speed").value));
}

function stop() {
  clearInterval(timer);
  timer = null;
  $("play").textContent = "Play";
}

$("play").onclick = () => (timer ? stop() : play());
$("scrub").oninput = e => { stop(); show(Number(e.target.value)); };
$("speed").onchange = () => { if (timer) { stop(); play(); } };
$("run").onchange = e => load(e.target.value);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === " ") { e.preventDefault(); $("play").click(); }
  else if (e.key === "ArrowRight") { stop(); show(at + 1); }
  else if (e.key === "ArrowLeft") { stop(); show(at - 1); }
});

(async () => {
  try { runs = await (await fetch("runs.json", { cache: "no-store" })).json(); } catch { runs = {}; }
  const names = Object.keys(runs).sort((a, b) => (b.startsWith("reshape") || b === "outline-plan") - (a.startsWith("reshape") || a === "outline-plan") || a.localeCompare(b));
  for (const n of names) $("run").add(new Option(n, n));
  const wanted = new URLSearchParams(location.search).get("run");
  if (wanted && runs[wanted]) $("run").value = wanted;
  if (names.length) load($("run").value);
})();
</script>
</body>
</html>
