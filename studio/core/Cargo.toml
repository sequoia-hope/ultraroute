[package]
name = "studio-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:wasm-bindgen"]

[dependencies]
# The board drawing shared with Circuit Composer; web/package.json pins its renderer at the same commit.
board-draw = { git = "https://github.com/sequoia-hope/board-draw", rev = "d37b1f8eb25454facb83e07040f1e43e2798a6f5" }
serde_json.workspace = true
wasm-bindgen = { version = "=0.2.129", optional = true }
